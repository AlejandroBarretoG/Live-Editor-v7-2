<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Element Analysis Sync Test</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <div id="main-content-wrapper">
        <div class="container mx-auto p-8">
            <h1 id="test-target" data-label="Initial Label" class="text-2xl font-bold">Test Target</h1>
        </div>
    </div>

    <script src="../script_manager.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.addEventListener('modulesLoaded', async () => {
                console.log('--- Starting Element Analysis Sync Test ---');

                let testPassed = true;
                function assert(condition, message) {
                    if (!condition) {
                        console.error(`❌ FAIL: ${message}`);
                        testPassed = false;
                    } else {
                        console.log(`✅ PASS: ${message}`);
                    }
                }

                // Helper to introduce a small delay
                const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

                // 1. ========= FULL EDITOR INITIALIZATION =========
                window.EditorTools.UIManager.init();

                const mainContentWrapper = document.getElementById('main-content-wrapper');
                const treeViewRoot = document.getElementById('tree-view-root');

                let inspectorCore;
                let treeViewManager;
                let propertiesPanel;

                const historyManager = new window.EditorTools.HistoryManager(mainContentWrapper, () => {
                    const selectedElement = inspectorCore.getSelectedElement();
                    inspectorCore.refreshUIForElement(selectedElement);
                    if (treeViewManager) treeViewManager.rebuildTree();
                });

                treeViewManager = new window.EditorTools.DomTreeViewManager(treeViewRoot, mainContentWrapper);

                propertiesPanel = new window.EditorTools.PropertiesPanelManager({
                    panelCodigo: document.getElementById('panel-codigo'),
                    contenidoCodigo: document.getElementById('contenido-codigo'),
                    analysisContainer: document.getElementById('element-analysis-in-code'),
                    codigoHtmlToggle: document.getElementById('codigo-html-toggle'),
                    elementAnalysisToggle: document.getElementById('element-analysis-toggle')
                });

                const stylePanelManager = new window.EditorTools.StylePanelManager({ historyManager: historyManager });

                inspectorCore = new window.EditorTools.InspectorCore({
                    treeViewManager: treeViewManager,
                    historyManager: historyManager,
                    propertiesPanel: propertiesPanel,
                    stylePanelManager: stylePanelManager
                });

                stylePanelManager.inspectorCore = inspectorCore;
                propertiesPanel.inspectorCore = inspectorCore;

                window.EditorTools.initPanels();
                treeViewManager.init();
                propertiesPanel.init();
                stylePanelManager.init();
                inspectorCore.init();
                historyManager.saveState();

                // 2. ========= TEST EXECUTION =========

                const targetElement = document.getElementById('test-target');
                const analysisContainer = document.getElementById('element-analysis-in-code');

                // Step 1: Select the element
                console.log('Simulating click on target element...');
                targetElement.click();
                await wait(100); // Allow UI to update

                // Step 2: Find the editable span for data-label and edit it
                const attributeName = 'data-label';
                const newLabelValue = 'Updated Via Test';

                let editableSpan = analysisContainer.querySelector(`span[data-attribute-name="${attributeName}"]`);
                assert(editableSpan, `Editable span for '${attributeName}' should exist.`);
                assert(editableSpan.textContent === 'Initial Label', "Editable span should show the initial value.");

                console.log(`Editing '${attributeName}' to be '${newLabelValue}'...`);
                editableSpan.textContent = newLabelValue;
                editableSpan.dispatchEvent(new FocusEvent('blur')); // Trigger the update
                await wait(100);

                // Step 3: Verify the attribute was set on the actual DOM element
                assert(targetElement.getAttribute(attributeName) === newLabelValue, "The element's attribute should be updated in the DOM.");

                // Step 4: Deselect the element
                console.log("Deselecting element...");
                document.body.click();
                await wait(100);

                // Step 5: Reselect the element and verify persistence
                console.log("Reselecting element...");
                targetElement.click();
                await wait(100);

                editableSpan = analysisContainer.querySelector(`span[data-attribute-name="${attributeName}"]`);
                assert(editableSpan, "Editable span should exist on reselection.");
                assert(editableSpan.textContent === newLabelValue, "Editable span should show the persisted value on reselection.");

                // Step 6: Test undo functionality
                console.log("Testing undo...");
                historyManager.undo();
                await wait(100);

                editableSpan = analysisContainer.querySelector(`span[data-attribute-name="${attributeName}"]`);
                assert(editableSpan, "Editable span should exist after undo.");
                assert(editableSpan.textContent === 'Initial Label', "Undo should restore the original value in the UI.");
                assert(targetElement.getAttribute(attributeName) === 'Initial Label', "Undo should restore the original attribute in the DOM.");

                console.log('--- Test Complete ---');
                if(testPassed) {
                    console.log('%cAll tests passed!', 'color: green; font-weight: bold;');
                } else {
                    console.log('%cSome tests failed.', 'color: red; font-weight: bold;');
                }
            });
        });
    </script>
</body>
</html>
